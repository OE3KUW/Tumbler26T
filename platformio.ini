
; Tumbller-Portierung: dieselbe Regelung wie OE3KUW/TumbllerVSC, aber auf dem
; ESP32 der Platine tumlerV2 statt auf dem ATmega328 des Originals.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -Wall
; Zwei App-Partitionen, sonst kann OTA nicht in die jeweils andere schreiben
board_build.partitions = min_spiffs.csv
lib_deps =
    esphome/AsyncTCP-esphome@^1.2.2
    esphome/ESPAsyncWebServer-esphome@^2.1.0
    adafruit/Adafruit NeoPixel@^1.12.0

; Update ueber WLAN:  pio run -e ota -t upload
[env:ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = tumbler-orig.local
